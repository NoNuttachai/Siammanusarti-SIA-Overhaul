# Events
sia_events.1.t: "Crown Property Scandal"
sia_events.1.d: "In Parliament, opposition MP Liean Chaiyakharn opened a session with a scathing criticism of the Crown Property Bureau, accusing it of widespread corruption. He listed numerous members of Khana Ratsadon, military officials, and even the King's regents as having purchased Crown Property at prices far below market value and profited immensely \n\nThough Phraya Phahon replied that he was not aware of any members of his party being involved in dealings over Crown Property lands, this has greatly affected his standing as prime minister. Many within his party as well as the opposition urged him to take responsibility by resigning from his position."
sia_events.1.a: "The scandal has greatly damaged Khana Ratsadon reputation."

sia_events.2.t: "An Incident at Parliment"
sia_events.2.d: "While opposition MP Lien Chaiyacharn was enjoying a drink after a parliamentary session, governmental MPs surround him then suddenly grabbed his chair pinning him to it, and paraded him outside the building before throwing both the chair and him into the pool near Parliament. He emerged completely soaked."
sia_events.2.a: "Very unprofessional of the MPs"

sia_events.4.t: "Phraya Phahon Announces Intent to Resign"
sia_events.4.d: "Phraya Phahon has announced that he will be resigning from his post as Prime Minister and dissolving Parliament due to the Crown Property Scandal and heavy backlash from the opposition. \n\nHowever, the Regents reappointed Phraya Phahon and urged him to continue his office as caretaker Prime Minister until a successor from Khana Ratsadon could be chosen. Begrudgingly, Phraya Phahon accepted their appointment and continued his tenure as Prime Minister."
sia_events.4.a: "The question is, who choose succeed?"

sia_events.6.t: "Planting of Khana Ratsadon Plaque"
sia_events.6.d: "Today, a ceremony was held to place a memorial plaque at Dusit Palace Royal Plaza, at the exact location where Phraya Phahon addressed the revolutionary aims of governmental change to the assembled troops. \nThe plaque commemorates the Siamese Revolution and reads "Here, on the 24th of June 2475 BE (1932 AD) at dawn, Khana Ratsadon birthed the constitution for the nation's prosperity." "
sia_events.6.a: "Chaiyo!"

sia_events.7.t: "The King's Brief Visit to Thailand"
sia_events.7.d: "His Majesty has accepted the government's invitation to pay a brief visit to Bangkok. This marks his first visit to Siam as its monarch. He is accompanied by his mother, Srinagarindra, and his younger brother, Prince Bhumibol Adulyadej. \nThe royal barge anchored at Koh Si Chang, where the government dispatched HTMS Sri Ayutthaya to receive the royal entourage and transport them to Samut Prakan Province. \nThey then proceeded aboard HTMS Sri Ayutthaya to Bangkok and took up residence at Chitralada Palace. \nHis Majesty will stay in Thailand for approximately two months to attend royal ceremonies and complete official preparations before returning to Switzerland to continue his studies."
sia_events.7.a: "Throng Phra Charean!"

sia_events.8.t: "The King of the White Elephant Release in Theaters"
sia_events.8.d: "Recently released in theaters, The King of the White Elephant is a historical epic directed, written, and produced by Pridi Banomyong for international audiences. \n\nIt is the first Thai film filmed entirely with English dialogue. Set in 16th-century Ayutthaya, the movie follows King Chakra, who is focused on his royal duties. Meanwhile, the King faces the threat of invasion by the King of Honsa. Initially seeking peace, King Chakra is forced into war after negotiations fail.\n\nThe film was submitted for the Nobel Peace Prize and screened in Singapore and New York. However, amid global conflicts and tensions, Pridi's pro-peace message seems to fell on deaf ears."
sia_events.8.a: "Absolute Cinema"

sia_events.10.t: "Thai Language Reform"
sia_events.10.d: "As part of Plaek Phibunsongkhram’s cultural reforms, new words were introduced for everyday use, and many spelling reforms were officially implemented in the Thai language.\n\nMany Thai words were shortened in spelling, and the Thai alphabet was simplified.\n\nThe reforms also included the promotion of new greeting words, including the use of “Sawasdee” as a standard greeting, similar to the English word “Hello.” The term was coined by Phraya Upakit Silpasarn, who derived it from the Sanskrit word “Svasti.” He first used it at the Faculty of Arts at Chulalongkorn University, though it did not gain widespread usage until it was officially promoted by the government of Field Marshal Plaek Phibunsongkhram."
sia_events.10.a: "Sawadee Kub!"

sia_events.11.t: "The National Anthem of Thailand"
sia_events.11.d: "Prior to the Siamese Revolution, Siam did not officially have a national anthem. De facto, the royal anthem “Sansoen Phra Barami” (Glory to His Prestige) was played as the national anthem. \n\nWith the Siamese Revolution transitioning the nation from an absolute monarchy to a constitutional one, the government of Khana Ratsadon adopted a newly composed tune by Phra Chenduriyang, with lyrics penned by Khun Wichitmatra for “Phleng Chat Siam” (National Anthem of Siam). Additional changes to the lyrics were made by Chan Khamwilai in 1934. \n\nFollowing the change of the country’s name from Siam to Thailand under Marshal Plaek, a competition was launched to create a completely new set of lyrics, with those by Luang Saranupraphan winning. \n\nMarshal Plaek also announced policies ordering the anthem to be played twice daily in schools and government institutions, as well as broadcast over the radio at 8 AM and 6 PM. During these times, the populace is expected to stand and show respect to the nation."
sia_events.11.a: "Thawee, Meechai, Chaiyo!"

sia_global_events.1.t: "Siam Changes Name to Thailand"
sia_global_events.1.d: "The Government of Siam, now Thailand, has announced the name change from Siam to Thailand (Prathet Thai), a decision made by the Plaek Phibunsongkhram administration to align with its nationalist policies aimed at promoting a Thai ethnic identity. \n\nThis change was part of a broader cultural reform known as Rattaniyom, which sought to modernize the nation and foster a unified national identity. With the term "Thai" meaning "Free," it symbolized the independence and sovereignty of Thailand."
sia_global_events.1.a: "Even old New York was once New Amsterdam"

sia_unit_leader_event.1.t: "Songsuradet Rebellion Crushed"
sia_unit_leader_event.1.d: "Accused of plotting a rebellion and attempting to assassinate Plaek Phibunsongkhram, Phraya Songsuradet, a long-time rival of Phibun, has been stripped of his military duties and forced into exile.\n\nPoliticians, military officers, and aristocrats accused of aiding or participating in the alleged rebellion have been arrested.\nAmong them are Rangsit Prayurasakdi, General Phraya Thephatsadin and both of his sons, Lieutenant Colonel Nor Nean Talaluk, Phraya Udomphongphensawat, and more than twenty other individuals.\n\nHowever, the legitimacy of the alleged plot has been widely questioned. There is little evidence proving that Songsuradet was truly planning a rebellion against Phibun, and many believe that the claim of the "Songsuradet Rebellion" was in fact a purge by Phibun against his political opponents and perceived enemies of Khana Ratsadon." \n\nA special tribunal has been convened for the trial of the alleged conspirators. Eighteen are expected to face the death penalty, while the remaining defendants will receive prison sentences."
sia_unit_leader_event.1.a: "A Rebellion of the Eighteen Corpses"

