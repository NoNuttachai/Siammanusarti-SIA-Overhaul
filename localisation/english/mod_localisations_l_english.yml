SIA_on_our_own_desc: "The world has opted to tear itself apart once more. If we are to endure and come out stronger than ever, we must find ways to use our resources for our own purposes."

SIA_expand_rubber_exports: "Expand Rubber Exports"
SIA_expand_rubber_exports_desc: "Rubber and its' derivatives are all too valuable in modern warfare. Even if it is difficult to export it with current conditions on the waves, perhaps we can profit off this and demand for other goods."

