SIA_discontent_within_the_ranks: "Discontent within the Ranks"
SIA_discontent_within_the_ranks_desc: "While many within the military support Pridi Banomyong's leadership, several right-wing commanding officers view him as a Communist and a threat to the country. They have begun plotting a military coup against him by coercing others to join their scheme.\n\nWe can prevent such an attack on democracy by swaying neutral commanders to our side or by removing or persuading hostile officers within the armed forces.\n\n§YCommanding Officers Current Support:§!\n[?SIA.SIA_supportive_leaders|.0Y] are §Gsupportive§! of Pridi's government.\n[?SIA.SIA_hostile_leaders|.0Y] are §Rhostile§! to Pridi's government.\n\nAs long as Khana Ratsadon is in power:\nIf the popularity of Democracy is below 75% and 7 commanding officers are hostile, §Ra military coup will occur!§!\nCompleting the focus '§YCurtail the Army§!' will quash any plot for a military coup."
