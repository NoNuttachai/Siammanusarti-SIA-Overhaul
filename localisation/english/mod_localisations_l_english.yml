sia_events.70.desc: "Our recently purchased ships from [ITA.GetName] have now left port. It will take them approximately a month to make the journey to [SIA.GetNameDef] due to the need to refuel on the way."
sia_events.71.t: "Former [ITA.GetAdjective] Ships Headed to [SIA.GetName] "
sia_events.71.desc: "Two former [ITA.GetAdjective] destroyers have arrived in one of our ports today. The ships were purchased by the [SIA.GetAdjective] government and are in the process of being transferred to [SIA.GetName]. While they are refueling, we could take control of the ships and potentially use them ourselves. Although this would likely damage relations with [SIA.GetName]."
sia_events.71.b: "We don't want to damage relations with [SIA.GetName]"
sia_events.73.t: "[SIA.GetName] Demands Release of Ships"
sia_events.73.desc: "The [SIA.GetAdjective] government has made clear that they consider our seizure of their vessels as an act of war and that they will be forced to respond in kind if we do not release them immediately. "
sia_events.74.t: "[SIA.GetName] Accepts Ship Internment"
sia_events.74.desc: "The [SIA.GetAdjective] government seems to have given up on attempting to get their ships back. After a few minor modifications, the ships are now ready for service with our navy."
sia_events.76.desc: "Tensions have finally settled between [ENG.GetName] and [SIA.GetName] following the release of our ships. Clearly the [ENG.GetAdjective] wanted to avoid entangling themselves in a conflict with us over some old ships."

