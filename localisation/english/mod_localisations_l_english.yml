SIA_succession_of_khana_ratsadon: "Succession of Khana Ratsadon"
SIA_succession_of_khana_ratsadon_desc: "Although Phraya Phahon has announced his plans to resign, the regents to His Majesty have reappointed him as caretaker prime minister until a suitable candidate can assume leadership of Khana Ratsadon.\n\nTwo major candidates are being considered: \n§8The ultranationalist Phibun§! and §2the democratic socialist Pridi.§! Though they are political opposites, both served side by side in the Siamese Revolution and currently hold ministerial positions in Phraya Phahon’s cabinet.\n\nShould either rise to leadership, Siam would be steered in profoundly different directions.\n\n§YCurrently the most popular figure within Khana Ratsadon is: \n§! [Root.SIA_phraya_successor] who will succeed Phraya Phahon as leader."
